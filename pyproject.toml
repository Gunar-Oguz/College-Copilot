[project]
name = "collegecopilot"
version = "1.0.0"
description = "AI college-search assistant for admissions counselors"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Data loaders hold long column descriptions (they become the planner's schema notes).
"backend/load_*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs the local PostgreSQL database (skipped when it is not reachable)",
]
