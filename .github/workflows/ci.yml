name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        # No PostgreSQL service here: its tests skip, and the DuckDB, access-gate, cost-guard and
        # Streamlit tests run on a tiny synthetic database. No secrets and no network calls.
        run: python -m pytest -q
