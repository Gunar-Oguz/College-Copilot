<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CollegeCopilot</title>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: 110px;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 880px;
      margin: 0 auto;
    }

    .empty-state {
      margin: 28px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 680px;
      line-height: 1.6;
      padding: 8px 0 24px;
    }

    .empty-state h2 {
      color: var(--text);
      font-size: 1.6rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .empty-state h2 span { color: var(--brand); }

    .examples-label {
      margin-top: 26px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
      text-align: left;
    }

    .examples button {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.9rem;
      line-height: 1.35;
      padding: 12px 14px;
      border-radius: 14px;
      align-self: stretch;
      white-space: normal;
      text-align: left;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .examples button:hover:not(:disabled) {
      border-color: var(--brand);
      box-shadow: 0 4px 14px rgba(59, 63, 216, 0.14);
      transform: translateY(-1px);
      opacity: 1;
    }

    .examples button:focus-visible { outline: 3px solid rgba(59, 63, 216, 0.35); outline-offset: 2px; }

    .example-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand-soft);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .sources-line { margin-top: 22px; font-size: 0.78rem; }

    .message { display: flex; flex-direction: column; max-width: 75%; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.ai { align-self: flex-start; align-items: flex-start; }
    .message.answer { align-self: stretch; max-width: 100%; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--ai-bg);
      border-bottom-left-radius: 4px;
    }

    /* Answer card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .summary { font-size: 0.98rem; line-height: 1.55; }

    .block-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .source { font-size: 0.75rem; color: var(--muted); }

    .school-link { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
    .school-link:hover { color: var(--brand); }
    .card.fallback { margin-top: 8px; }
    .fallback-links { display: flex; gap: 16px; font-size: 0.85rem; font-weight: 600; }
    .fallback-links a { color: var(--brand); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
    .suggestion {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: left;
      white-space: normal;
      align-self: auto;
    }
    .suggestion:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); opacity: 1; }
    .saved-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    a.back-btn { text-decoration: none; display: inline-block; border-radius: 12px; font-weight: 600; }

    .answer-notes { display: flex; flex-direction: column; gap: 4px; }
    .answer-notes p {
      font-size: 0.82rem;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 7px 10px;
    }

    .feedback { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
    .feedback button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.95rem;
      line-height: 1.2;
      align-self: auto;
    }
    .feedback button:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); opacity: 1; }
    .feedback .thanks { color: #047857; font-weight: 600; }
    .message.ai .feedback { margin-top: 6px; }

    /* Stat tiles */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat .label { font-size: 0.78rem; color: var(--muted); }
    .stat .value {
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .stat .value.missing { font-size: 0.95rem; font-weight: 500; color: var(--muted); }

    /* Ranked bars: one series, value labels at the bar end */
    .bars { display: flex; flex-direction: column; gap: 6px; }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(120px, 38%) 1fr auto;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 2px 4px;
      border-radius: 6px;
    }

    .bar-row:hover { background: var(--surface-2); }
    .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 14px; background: var(--track); border-radius: 0 4px 4px 0; }
    .bar-fill {
      height: 100%;
      min-width: 2px;
      background: var(--series-1);
      border-radius: 0 4px 4px 0;
    }
    .bar-row .num {
      font-variant-numeric: tabular-nums;
      min-width: 64px;
      text-align: right;
      color: var(--text);
    }

    /* Tables */
    .table-wrap {
      overflow: auto;
      max-height: 440px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

    th, td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      white-space: nowrap;
    }

    /* Only the school name wraps; other columns stay on one line and the table scrolls. */
    td:first-child { white-space: normal; min-width: 180px; }

    th {
      background: var(--surface-2);
      font-weight: 600;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface-2); }
    td.missing { color: var(--muted); }

    tr.reference td { background: var(--ref-bg); }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: 1px;
      white-space: nowrap;
    }

    .tag.ref { background: #ffe8bf; color: var(--ref-text); }
    .tag.best { background: var(--best-bg); color: var(--best-text); }

    .compare td.best { font-weight: 650; }
    .compare th:first-child, .compare td:first-child { color: var(--muted); font-weight: 500; }

    /* Loading: typing dots, a status line that advances, and a skeleton answer card */
    .message.loading { align-self: stretch; max-width: 100%; gap: 10px; }

    .loading-bubble {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      color: var(--muted);
      padding: 10px 14px;
      background: var(--ai-bg);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      font-size: 0.875rem;
    }

    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .loading-status { transition: opacity 0.25s; }

    .skeleton { gap: 12px; }
    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--surface-2) 25%, #e6e8f1 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }
    .skeleton-line.short { width: 55%; }
    .skeleton-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .skeleton-tiles .skeleton-line { height: 58px; border-radius: 12px; }

    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    @media (prefers-reduced-motion: reduce) {
      .dots span, .skeleton-line { animation: none; }
      .examples button { transition: none; }
    }

    .error-bubble {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      max-width: 480px;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.1);
    }

    .input-row { display: flex; gap: 10px; max-width: 880px; margin: 0 auto; width: 100%; }

    textarea {
      flex: 1;
      resize: none;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      font-size: 0.925rem;
      line-height: 1.5;
      min-height: 48px;
      max-height: 120px;
      background: #fff;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 63, 216, 0.15);
    }


    /* My Saved Schools */
    #saved-view { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    #saved-view[hidden], #messages[hidden] { display: none; }
    .saved-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .saved-head h2 { font-size: 1.35rem; letter-spacing: -0.02em; }
    .back-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-size: 0.85rem; padding: 8px 14px; align-self: auto; }
    .saved-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .saved-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .saved-card h3 { font-size: 1.05rem; letter-spacing: -0.01em; }
    .saved-card .place { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .remove-btn { background: #fff1f2; color: #be123c; font-size: 0.8rem; padding: 7px 12px; align-self: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; font-size: 0.8rem; }
    .chip b { display: block; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
    .notes { display: flex; flex-direction: column; gap: 8px; }
    .notes-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .note { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; }
    .note-text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .note-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 0.75rem; color: var(--muted); }
    .note-meta button, .note-edit-actions button { background: none; color: var(--brand); padding: 0; font-size: 0.78rem; align-self: auto; }
    .note-meta button.danger { color: #be123c; }
    .note textarea, .note-form textarea { width: 100%; min-height: 64px; font-size: 16px; }
    .note-edit-actions { display: flex; gap: 14px; margin-top: 6px; }
    .note-form { display: flex; gap: 8px; align-items: flex-end; }
    .note-form textarea { flex: 1; min-height: 44px; }
    .note-form button { padding: 10px 14px; font-size: 0.85rem; }
    .saved-empty { text-align: center; color: var(--muted); padding: 40px 12px; line-height: 1.6; }
    body.signed-in .sign-in-hint { display: none; }
    body.saved-page footer { display: none; }

    @media (max-width: 640px) {
      .saved-card { padding: 14px 12px; }
      .note-form { flex-direction: column; align-items: stretch; }
      #chat { padding: 12px 12px 100px; }
      .empty-state { margin-top: 12px; }
      .empty-state h2 { font-size: 1.3rem; }
      .examples { grid-template-columns: 1fr; gap: 8px; }
      .examples button { padding: 10px 12px; font-size: 0.875rem; }
      .example-icon { width: 30px; height: 30px; font-size: 0.95rem; }
      .message { max-width: 92%; }
      .card { padding: 14px 12px; gap: 14px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .stat { padding: 10px 12px; }
      .stat .value { font-size: 1.2rem; }
      .bar-row { grid-template-columns: minmax(0, 42%) 1fr auto; gap: 8px; font-size: 0.8rem; }
      .bar-row .num { min-width: 0; }
      td:first-child { min-width: 140px; }
      th, td { padding: 7px 10px; }
      .table-wrap { max-height: 360px; }
      .skeleton-tiles { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
      .input-row { gap: 8px; }
      /* 16px keeps iOS Safari from zooming into the field on focus */
      textarea { font-size: 16px; padding: 11px 12px; }
      .input-row > button { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#ffffff" fill-opacity="0.14"/>
        <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
        <path d="M20 9 L34 16 L20 23 L6 16 Z" fill="#ffffff"/>
        <path d="M12 19.5 V26 C12 28.8 16 31 20 31 C24 31 28 28.8 28 26 V19.5 L20 23.5 Z" fill="#ffffff" fill-opacity="0.85"/>
        <path d="M31 17.5 V25" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
        <circle cx="31" cy="26.5" r="2" fill="#fcd34d"/>
      </svg>
      <div>
        <h1>College<span class="accent">Copilot</span></h1>
        <p>Answers about U.S. colleges, straight from public data</p>
      </div>
      <div class="account">
        <button type="button" class="new-chat" id="new-chat" aria-label="New chat" hidden>+<span class="btn-label"> New chat</span></button>
        <div id="signed-out" class="account" hidden>
          <button type="button" class="header-btn" data-auth="signin">Sign in</button>
          <button type="button" class="header-btn primary signup" data-auth="signup">Sign up</button>
        </div>
        <div id="signed-in" class="account" hidden>
          <button type="button" class="header-btn" id="saved-btn" aria-label="My saved schools">♥<span class="btn-label"> Saved</span><span class="saved-count" id="saved-count">0</span></button>
          <span class="user-email" id="user-email"></span>
          <button type="button" class="header-btn" id="sign-out">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div id="messages">
      <div class="empty-state" id="empty-state">
        <h2>Find the right college, <span>with real data</span></h2>
        Costs, admissions, graduation rates, earnings, majors, careers, campus safety and more.
        <div class="examples-label">Try asking</div>
        <div class="examples">
          <button type="button"><span class="example-icon" aria-hidden="true">🎓</span><span class="example-text">What is the graduation rate at UCLA?</span></button>
          <button type="button"><span class="example-icon" aria-hidden="true">🏆</span><span class="example-text">Top 10 universities in California by graduation rate</span></button>
          <button type="button"><span class="example-icon" aria-hidden="true">⚖️</span><span class="example-text">Compare Harvard and Yale on cost and outcomes</span></button>
          <button type="button"><span class="example-icon" aria-hidden="true">💼</span><span class="example-text">What jobs can a computer science major get?</span></button>
          <button type="button"><span class="example-icon" aria-hidden="true">📈</span><span class="example-text">Which colleges have the highest economic mobility?</span></button>
          <button type="button"><span class="example-icon" aria-hidden="true">🛡️</span><span class="example-text">Show me campus crime at UC Berkeley</span></button>
        </div>
        <p class="sources-line">Data from College Scorecard, IPEDS, Opportunity Insights, BLS, Census and more.</p>
      </div>
    </div>
    <section id="saved-view" hidden aria-labelledby="saved-title"></section>
  </main>


  <footer>
    <div class="input-row">
      <textarea id="question" rows="1" placeholder="Ask a question about colleges..." aria-label="Your question"></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    const API_URL = "/ask";
    const chat = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const emptyState = document.getElementById("empty-state");
    const questionInput = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat");
    const footer = document.querySelector("footer");
    const savedView = document.getElementById("saved-view");
    // A school's name, linked to its profile page when we know which school it is.
    function schoolName(schoolId, name) {
      return schoolId ? `<a class="school-link" href="/school/${schoolId}">${escapeHtml(name)}</a>` : escapeHtml(name);
    }

    function renderStats(block) {
      const tiles = block.items.map(item => {
        const missing = item.display === "Not reported";
        return `<div class="stat">
          <div class="label">${escapeHtml(item.label)}</div>
          <div class="value ${missing ? "missing" : ""}">${escapeHtml(item.display)}</div>
        </div>`;
      }).join("");
      const title = block.title
        ? `<div class="block-title stats-title">${saveButton(block.school_id, block.title)}${schoolName(block.school_id, block.title)}</div>`
        : "";
      return `<section>${title}<div class="stats">${tiles}</div></section>`;
    }

    function renderBars(block) {
      const rows = block.items.map(item => {
        const pct = Math.max(0, (item.value / block.max) * 100);
        const tip = `${item.label}: ${item.display}`;
        return `<div class="bar-row" title="${escapeHtml(tip)}">
          <span class="name">${saveButton(item.school_id, item.label)}${schoolName(item.school_id, item.label)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
          <span class="num">${escapeHtml(item.display)}</span>
        </div>`;
      }).join("");
      return `<section aria-label="${escapeHtml(block.title)} chart">
        <div class="block-title">${escapeHtml(block.title)}</div>
        <div class="bars">${rows}</div>
      </section>`;
    }

    function renderCompare(block) {
      const ids = block.school_ids || [];
      const head = `<tr><th></th>${block.schools.map((s, i) =>
        `<th>${saveButton(ids[i], s)}${schoolName(ids[i], s)}</th>`).join("")}</tr>`;
      const body = block.rows.map(row => `<tr>
        <td>${escapeHtml(row.label)}</td>
        ${row.cells.map(cell => {
          const missing = cell.display === "Not reported";
          const cls = [cell.best ? "best" : "", missing ? "missing" : ""].join(" ");
          const tag = cell.best ? `<span class="tag best">Best</span>` : "";
          return `<td class="${cls}">${escapeHtml(cell.display)}${tag}</td>`;
        }).join("")}
      </tr>`).join("");
      return `<section>
        <div class="table-wrap compare"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
      </section>`;
    }

    function renderTable(block) {
      const head = `<tr>${block.columns.map(c =>
        `<th class="${c.numeric ? "num" : ""}">${escapeHtml(c.label)}</th>`).join("")}</tr>`;
      const body = block.rows.map(row => `<tr class="${row.reference ? "reference" : ""}">
        ${row.cells.map((cell, i) => {
          const col = block.columns[i];
          const missing = cell === "Not reported";
          const tag = row.reference && i === 0 ? `<span class="tag ref">Your school</span>` : "";
          const heart = i === 0 ? saveButton(row.school_id, cell) : "";
          const text = i === 0 ? schoolName(row.school_id, cell) : escapeHtml(cell);
          return `<td class="${col.numeric ? "num" : ""} ${missing ? "missing" : ""}">${heart}${text}${tag}</td>`;
        }).join("")}
      </tr>`).join("");
      return `<section><div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></section>`;
    }

    const RENDERERS = { stats: renderStats, bars: renderBars, compare: renderCompare, table: renderTable };

    function renderAnswer(data) {
      const blocks = (data.blocks || []).map(b => (RENDERERS[b.type] || (() => ""))(b)).join("");
      const source = data.source ? `<div class="source">Source: ${escapeHtml(data.source)}</div>` : "";
      const hasSchools = blocks.includes("save-btn");
      const hint = hasSchools && authReady
        ? `<p class="sign-in-hint">♡ <button type="button" class="link-btn" data-auth="signin">Sign in</button> to save schools</p>`
        : "";
      const notes = (data.notes || []).length
        ? `<div class="answer-notes">${data.notes.map(n => `<p>${escapeHtml(n)}</p>`).join("")}</div>`
        : "";
      return `<div class="card">
        <p class="summary">${escapeHtml(data.response)}</p>
        ${notes}
        ${blocks}
        ${hint}
        ${source}
        ${feedbackButtons(data.log_id)}
      </div>`;
    }

    // "Can't answer": what we do know about the school, and questions we can answer.
    function renderFallback(fallback) {
      const s = fallback.school;
      let school = "";
      if (s) {
        const st = s.stats;
        const pct = v => (v == null ? "Not reported" : `${(Number(v) * 100).toFixed(1)}%`);
        const money = v => (v == null ? "Not reported" : `$${Math.round(Number(v)).toLocaleString()}`);
        const tiles = [["Graduation rate", pct(st.graduation_rate)], ["Acceptance rate", pct(st.acceptance_rate)],
          ["Average net price", money(st.net_price)], ["Median earnings", money(st.median_earnings)]]
          .map(([label, value]) => `<div class="stat"><div class="label">${label}</div>
            <div class="value ${value === "Not reported" ? "missing" : ""}">${value}</div></div>`).join("");
        school = `<div class="block-title stats-title">${saveButton(s.id, s.name)}${schoolName(s.id, s.name)}</div>
          <p class="sign-in-hint">${escapeHtml([s.city, s.state].filter(Boolean).join(", "))} · ${escapeHtml(s.type || "")}</p>
          <div class="stats">${tiles}</div>
          <div class="fallback-links"><a href="${s.url}">Full profile →</a>
            ${s.website ? `<a href="${escapeHtml(s.website)}" target="_blank" rel="noopener">Official website ↗</a>` : ""}</div>`;
      }
      const suggestions = fallback.suggestions.map(q =>
        `<button type="button" class="suggestion">${escapeHtml(q)}</button>`).join("");
      return `<div class="card fallback">${school}
        <div><div class="block-title">Questions I can answer</div><div class="suggestions">${suggestions}</div></div></div>`;
    }

    function feedbackButtons(logId) {
      if (!logId) return "";
      return `<div class="feedback" data-log-id="${logId}">
        <span>Was this helpful?</span>
        <button type="button" data-rating="up" aria-label="Helpful" title="Helpful">👍</button>
        <button type="button" data-rating="down" aria-label="Not helpful" title="Not helpful">👎</button>
      </div>`;
    }

    async function sendFeedback(button) {
      const box = button.closest(".feedback");
      box.querySelectorAll("button").forEach(b => { b.disabled = true; });
      try {
        const res = await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ log_id: Number(box.dataset.logId), rating: button.dataset.rating }),
        });
        if (!res.ok) throw new Error();
        box.innerHTML = `<span class="thanks" role="status">Thanks for your feedback!</span>`;
      } catch {
        box.querySelectorAll("button").forEach(b => { b.disabled = false; });
        showToast("Couldn't send feedback. Please try again.");
      }
    }

    function scrollToBottom(smooth = true) {
      chat.scrollTo({ top: chat.scrollHeight, behavior: smooth ? "smooth" : "instant" });
    }

    function addMessage(className, html) {
      emptyState?.remove();
      const wrap = document.createElement("div");
      wrap.className = `message ${className}`;
      wrap.innerHTML = html;
      messages.appendChild(wrap);
      requestAnimationFrame(() => scrollToBottom());
      return wrap;
    }

    const LOADING_STEPS = [
      "Understanding your question...",
      "Searching college data...",
      "Crunching the numbers...",
      "Writing a summary...",
    ];
    let loadingTimer = null;

    function showLoading() {
      const el = addMessage("loading", `
        <div class="loading-bubble" role="status">
          <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="loading-status">${LOADING_STEPS[0]}</span>
        </div>
        <div class="card skeleton" aria-hidden="true">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-tiles"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
        </div>`);
      el.id = "loading-msg";
      const status = el.querySelector(".loading-status");
      let step = 0;
      loadingTimer = setInterval(() => {
        if (step >= LOADING_STEPS.length - 1) return;
        step += 1;
        status.style.opacity = 0;
        setTimeout(() => { status.textContent = LOADING_STEPS[step]; status.style.opacity = 1; }, 250);
      }, 2500);
    }

    function removeLoading() {
      clearInterval(loadingTimer);
      document.getElementById("loading-msg")?.remove();
    }

    function showError(message) {
      removeLoading();
      addMessage("ai", `<div class="error-bubble">${escapeHtml(message)}</div>`);
    }

    let busy = false;

    async function sendQuestion(text) {
      const question = (text ?? questionInput.value).trim();
      if (busy) return;
      if (!question) { questionInput.focus(); return; }

      busy = true;
      if (location.hash === "#saved") location.hash = "";
      newChatBtn.hidden = false;
      addMessage("user", `<div class="bubble">${escapeHtml(question)}</div>`);
      questionInput.value = "";
      questionInput.style.height = "auto";
      sendBtn.disabled = true;
      showLoading();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        removeLoading();

        if (!res.ok) {
          const detail = data.detail || "Something went wrong.";
          showError(typeof detail === "string" ? detail : JSON.stringify(detail));
          return;
        }

        if (data.kind === "result") {
          addMessage("answer", renderAnswer(data));
        } else {
          const extra = data.fallback ? renderFallback(data.fallback) : "";
          addMessage(extra ? "answer" : "ai",
            `<div class="bubble">${escapeHtml(data.response)}</div>${extra}${feedbackButtons(data.log_id)}`);
        }
      } catch {
        showError("Could not reach the server. Make sure the backend is running.");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        // Refocusing on phones would pop the keyboard over the answer.
        if (window.matchMedia("(hover: hover)").matches) questionInput.focus();
      }
    }

    // ---------- My Saved Schools ----------

    function renderNote(note) {
      return `<div class="note" data-note-id="${note.id}">
        <div class="note-text">${escapeHtml(note.note_text)}</div>
        <div class="note-meta">
          <span>${fmt.date(note.created_at)}</span>
          <button type="button" data-action="edit-note">Edit</button>
          <button type="button" class="danger" data-action="delete-note">Delete</button>
        </div>
      </div>`;
    }

    function renderSavedCard(school) {
      const chips = [
        ["Acceptance rate", fmt.pct(school.admission_rate)],
        ["Average net price", fmt.money(school.cost_avg_net_price)],
        ["Graduation rate", fmt.pct(school.completion_rate)],
        ["Median earnings", fmt.money(school.earnings_median_10yr)],
        ["Students", fmt.int(school.student_size)],
      ].map(([label, value]) => `<div class="chip">${label}<b>${value}</b></div>`).join("");
      const place = [school.city, school.state].filter(Boolean).join(", ");
      return `<article class="saved-card" data-school-id="${school.school_id}">
        <div class="saved-card-head">
          <div>
            <h3><a class="school-link" href="/school/${school.school_id}">${escapeHtml(school.name || `School ${school.school_id}`)}</a></h3>
            <div class="place">${escapeHtml(place)}</div>
          </div>
          <button type="button" class="remove-btn" data-action="remove">♥ Remove</button>
        </div>
        <div class="chips">${chips}</div>
        <div class="notes">
          <div class="notes-title">My notes</div>
          ${school.notes.map(renderNote).join("")}
          <form class="note-form" data-action="add-note">
            <textarea placeholder="Add a note, e.g. visit in April, ask about scholarships..." aria-label="New note" maxlength="5000"></textarea>
            <button type="submit">Add note</button>
          </form>
        </div>
      </article>`;
    }

    async function showSaved() {
      if (!session) {
        openAuth("signin", "Sign in to see your saved schools.");
        location.hash = "";
        return;
      }
      messages.hidden = true;
      savedView.hidden = false;
      document.body.classList.add("saved-page");
      newChatBtn.hidden = true;
      savedView.innerHTML = `<div class="saved-head"><h2 id="saved-title">My Saved Schools</h2>
        <div class="saved-actions"><a class="back-btn" href="/compare">⚖ Compare schools</a>
        <button type="button" class="back-btn" data-action="back">← Back to search</button></div></div>
        <div class="loading-bubble"><span class="dots"><span></span><span></span><span></span></span> Loading your schools...</div>`;
      chat.scrollTo({ top: 0 });
      try {
        const { favorites: list } = await api("/me/favorites");
        favorites.clear();
        list.forEach(s => favorites.add(s.school_id));
        refreshHearts();
        const body = list.length
          ? list.map(renderSavedCard).join("")
          : `<div class="saved-empty">No saved schools yet.<br>Tap ♡ next to any school in your results to save it here.</div>`;
        savedView.innerHTML = savedView.querySelector(".saved-head").outerHTML + body;
      } catch (err) {
        if (err.message !== "signed out") savedView.querySelector(".loading-bubble").textContent = err.message;
      }
    }

    function showChat() {
      messages.hidden = false;
      savedView.hidden = true;
      document.body.classList.remove("saved-page");
      newChatBtn.hidden = !messages.querySelector(".message");
    }

    function route() {
      if (location.hash === "#saved") showSaved();
      else showChat();
    }

    async function handleSavedClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const card = button.closest(".saved-card");
      const noteEl = button.closest(".note");
      const action = button.dataset.action;
      try {
        if (action === "back") {
          location.hash = "";
        } else if (action === "remove") {
          const id = Number(card.dataset.schoolId);
          await api(`/me/favorites/${id}`, { method: "DELETE" });
          favorites.delete(id);
          refreshHearts();
          card.remove();
          if (!savedView.querySelector(".saved-card")) showSaved();
        } else if (action === "edit-note") {
          const text = noteEl.querySelector(".note-text").textContent;
          noteEl.innerHTML = `<textarea aria-label="Edit note" maxlength="5000">${escapeHtml(text)}</textarea>
            <div class="note-edit-actions"><button type="button" data-action="save-note">Save</button>
            <button type="button" data-action="cancel-note">Cancel</button></div>`;
          noteEl.dataset.original = text;
          noteEl.querySelector("textarea").focus();
        } else if (action === "save-note") {
          const text = noteEl.querySelector("textarea").value.trim();
          if (!text) { showToast("Note cannot be empty"); return; }
          const note = await api(`/me/notes/${noteEl.dataset.noteId}`, {
            method: "PUT", body: JSON.stringify({ note_text: text }),
          });
          noteEl.outerHTML = renderNote(note);
        } else if (action === "cancel-note") {
          showSaved();
        } else if (action === "delete-note") {
          await api(`/me/notes/${noteEl.dataset.noteId}`, { method: "DELETE" });
          noteEl.remove();
        }
      } catch (err) {
        if (err.message !== "signed out") showToast(err.message);
      }
    }

    async function handleAddNote(event) {
      const form = event.target.closest("form[data-action='add-note']");
      if (!form) return;
      event.preventDefault();
      const textarea = form.querySelector("textarea");
      const text = textarea.value.trim();
      if (!text) { textarea.focus(); return; }
      const id = form.closest(".saved-card").dataset.schoolId;
      try {
        const note = await api(`/me/favorites/${id}/notes`, { method: "POST", body: JSON.stringify({ note_text: text }) });
        form.insertAdjacentHTML("beforebegin", renderNote(note));
        textarea.value = "";
      } catch (err) {
        if (err.message !== "signed out") showToast(err.message);
      }
    }

    savedView.addEventListener("click", handleSavedClick);
    savedView.addEventListener("submit", handleAddNote);
    messages.addEventListener("click", event => {
      const heart = event.target.closest(".save-btn");
      if (heart) toggleSave(Number(heart.dataset.schoolId));
      const vote = event.target.closest(".feedback button[data-rating]");
      if (vote) sendFeedback(vote);
      const suggestion = event.target.closest(".suggestion");
      if (suggestion) sendQuestion(suggestion.textContent);
    });
    window.addEventListener("hashchange", route);
    window.onSavedClick = showSaved;
    window.onAuthChanged = () => {
      if (!session && location.hash === "#saved") location.hash = "";
      route();
    };

    sendBtn.addEventListener("click", () => sendQuestion());

    document.querySelectorAll(".examples button").forEach(btn =>
      btn.addEventListener("click", () => sendQuestion(btn.querySelector(".example-text").textContent)));

    newChatBtn.addEventListener("click", () => {
      if (busy) return;
      messages.replaceChildren(emptyState);
      newChatBtn.hidden = true;
      history.replaceState(null, "", location.pathname);
      chat.scrollTo({ top: 0 });
    });

    questionInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });

    // Wait for sign-in setup so a shared question's results get Save buttons.
    const sharedQuestion = new URLSearchParams(location.search).get("q");
    initAuth().finally(() => { if (sharedQuestion) sendQuestion(sharedQuestion); });

    questionInput.addEventListener("input", () => {
      questionInput.style.height = "auto";
      questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
